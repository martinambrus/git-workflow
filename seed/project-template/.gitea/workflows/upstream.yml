name: upstream
# Sends in-place changes of shared modules to the module repository as a merge request (plan 6.5).
# No `uses:` steps: everything is plain shell in our runner image (plan 2.4).
# It runs when a pull request is opened or gets new commits, so a branch that is only pushed does not open a merge
# request in the module repository before its pull request exists. The job links the merge request in the project PR.
on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: upstream-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: activit-runner
    steps:
      - name: Upstream
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v1.9.7 \
            "http://bot:${BOT_TOKEN}@gitea.test:3000/activit/ci-tools.git" /tmp/ci-tools
          export GITEA_URL="${{ github.server_url }}" REPOSITORY="${{ github.repository }}" \
                 BRANCH="${{ github.head_ref || github.ref_name }}" \
                 SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          /tmp/ci-tools/bin/upstream.sh
