name: upstream
# Sends in-place changes of shared modules to the module repository as a merge request (plan 6.5).
# No `uses:` steps: everything is plain shell in our runner image (plan 2.4).
# It also runs when a pull request is opened: on the branch's first push the project PR cannot exist yet, and the
# job links the merge request in the project PR. The concurrency group queues a push run and a PR run of the same
# branch, so they never race to open the merge request twice.
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened]

concurrency:
  group: upstream-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: activit-runner
    steps:
      - name: Upstream
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v1.8.6 \
            "http://bot:${BOT_TOKEN}@gitea.test:3000/activit/ci-tools.git" /tmp/ci-tools
          export GITEA_URL="${{ github.server_url }}" REPOSITORY="${{ github.repository }}" \
                 BRANCH="${{ github.head_ref || github.ref_name }}" \
                 SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          /tmp/ci-tools/bin/upstream.sh
