name: upstream
# Sends in-place changes of shared modules to the module repository as a merge request (plan 6.5).
# No `uses:` steps: everything is plain shell in our runner image (plan 2.4).
on:
  push:
    branches: ['**']

jobs:
  upstream:
    runs-on: activit-runner
    steps:
      - name: Upstream
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v1.0.0 \
            "http://bot:${BOT_TOKEN}@gitea.test:3000/activit/ci-tools.git" /tmp/ci-tools
          export GITEA_URL="${{ github.server_url }}" REPOSITORY="${{ github.repository }}" \
                 BRANCH="${{ github.ref_name }}" SHA="${{ github.sha }}"
          /tmp/ci-tools/bin/upstream.sh
