name: checks
# Plan section 12 checks 1-4: gitlinks / nested .git, symlinks, dev- versions in the lock, drift against composer.lock.
# Required on pull requests into main. Plain shell steps from ci-tools, no `uses:` (plan 2.4).
on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  checks:
    runs-on: activit-runner
    steps:
      - name: Checks
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PACKETON_TOKEN: ${{ secrets.PACKETON_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v1.8.8 \
            "http://bot:${BOT_TOKEN}@gitea.test:3000/activit/ci-tools.git" /tmp/ci-tools
          export GITEA_URL="${{ github.server_url }}" REPOSITORY="${{ github.repository }}" \
                 EVENT="${{ github.event_name }}" BRANCH="${{ github.head_ref || github.ref_name }}" \
                 BASE_REF="${{ github.base_ref }}" PACKETON_URL="http://packeton.test"
          /tmp/ci-tools/bin/check-project.sh
