name: checks
# Plan section 12 check 5 (+ PHP and YAML syntax). Runs on every pull request, including the merge requests the
# Upstream job opens, so a reviewer sees red or green before merging.
on:
  pull_request:
    branches: [main, '*.x']

jobs:
  checks:
    runs-on: activit-runner
    steps:
      - name: Checks
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v1.9.2 \
            "http://bot:${BOT_TOKEN}@gitea.test:3000/activit/ci-tools.git" /tmp/ci-tools
          export GITEA_URL="${{ github.server_url }}" REPOSITORY="${{ github.repository }}" \
                 BRANCH="${{ github.head_ref }}"
          /tmp/ci-tools/bin/check-module.sh
