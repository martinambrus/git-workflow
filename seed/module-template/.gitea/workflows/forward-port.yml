name: forward-port
# After a change lands on a maintenance branch (1.x, 2.x ...), open a pull request that carries it to the next higher
# line, or to main when there is none. On a conflict it opens an issue instead of guessing. Plain shell steps from
# ci-tools, no `uses:` (plan 2.4).
on:
  push:
    branches: ['*.x']

jobs:
  forward-port:
    runs-on: activit-runner
    steps:
      - name: Forward-port
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v1.8.5 \
            "http://bot:${BOT_TOKEN}@gitea.test:3000/activit/ci-tools.git" /tmp/ci-tools
          export GITEA_URL="${{ github.server_url }}" REPOSITORY="${{ github.repository }}" \
                 BRANCH="${{ github.ref_name }}" BEFORE="${{ github.event.before }}" AFTER="${{ github.sha }}"
          /tmp/ci-tools/bin/forward-port.sh
