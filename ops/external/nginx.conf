# TLS front for Packeton: the ONLY thing the "customer" network can reach (plan 2.2: Packeton external, Gitea internal).
server {
    listen 443 ssl;
    server_name packeton-ext.test;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    client_max_body_size 100m;

    location / {
        proxy_pass http://packeton.test:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Packeton advertises the internal Gitea clone URL as source.url. Customers install dist archives only,
        # so hide the internal hostname from the metadata they receive.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'http://gitea.test:3000' 'https://git.internal.invalid';
    }
}
