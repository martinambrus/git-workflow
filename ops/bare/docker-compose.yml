# "Bare" stack for a manual, from-scratch setup (see manual/TASKLIST.md): only Gitea 28.1 and Packeton are running.
# No users, no organizations, no repositories, no tokens, no webhooks, no runner: you do that (and screenshot it).
# Same names and ports as the automated lab (gitea.test:3000, packeton.test:80, network wf-net), but its own
# project name and volumes, so the automated lab (./lab up) and this one never share data. Run only one of them.
name: wfbare
services:
  gitea:
    image: gitea/gitea@sha256:f505a0d3a41323b786e05942fc7a4075e07ae7c169fd9485649aa55ee543a21a  # 28.1.0
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: gitea.test
      GITEA__server__ROOT_URL: http://gitea.test:3000/
      GITEA__server__SSH_DOMAIN: gitea.test
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__SSH_LISTEN_PORT: "22"
      # NOTE: INSTALL_LOCK is deliberately not set: the first visit shows Gitea's install wizard.
    # settings you add during the guide (Actions, egress policy, ...), one KEY=value per line
    env_file:
      - path: ./gitea.env
        required: false
    volumes:
      - gitea-data:/data
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"
    networks:
      default:
        aliases: [gitea.test]

  packeton:
    image: packeton/packeton@sha256:373462ffb14a9aac377f8e2354904ae31ee922af0bcac63847f81fc16396e811  # latest on 2026-10-13
    restart: unless-stopped
    environment:
      APP_ENV: prod
      PUBLIC_ACCESS: "false"
      # no ADMIN_USER here: you create the admin yourself (plan 2.2)
    volumes:
      - packeton-data:/data
    ports:
      - "127.0.0.1:80:80"
    networks:
      default:
        aliases: [packeton.test]

  # Registered by you after Gitea is installed (profile: runner): ./lab bare runner <registration-token>
  runner:
    image: gitea/act_runner@sha256:b5c35d6bdbb9bb25e531230bfc7cc663cb751406cbec90a2a891b85fea54de86  # 0.6.1
    profiles: [runner]
    restart: unless-stopped
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea.test:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: local-runner
    volumes:
      - ../runner/config.yaml:/config.yaml:ro
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [default]

  # The image every job runs in (plan 2.1); built once by ./lab bare up
  runner-image:
    image: activit-runner:local
    build: ../runner
    profiles: [build]

volumes:
  gitea-data:
  packeton-data:
  runner-data:

networks:
  default:
    name: wf-net
